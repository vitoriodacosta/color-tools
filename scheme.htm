<html>
	<head>
		<script type="module" src="scheme.js"></script>
		<meta name="color-scheme" content="light dark">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	<body>
		<ol>
			<li>
				<b>Scheme</b>
			</li>
			<ol>
				<li>
					<b>variant</b>
					<input id="1">
				</li>
				<li>
					<b>source</b>
				</li>
				<ol>
					<li>
						<b>from</b>
					</li>
					<ol>
						<li>
							<b>hue</b>
							<input id="2" inputmode="numeric">
						</li>
						<li>
							<b>chroma</b>
							<input id="3" inputmode="numeric">
						</li>
						<li>
							<b>tone</b>
							<input enterkeyhint="go" id="4" inputmode="numeric">
						</li>
					</ol>
					<li>
						<b>from int</b>
					</li>
					<ol>
						<li>
							<b>hex</b>
							<input enterkeyhint="go" id="5">
						</li>
					</ol>
				</ol>
				<li>
					<b>is dark</b>
					<input type="checkbox" id="6">
				</li>
				<li>
					<b>contrast level</b>
					<input id="7" inputmode="numeric">
				</li>
				<li>
					<b>spec version</b>
					<input id="8" inputmode="numeric">
				</li>
				<li>
					<b>result</b>
				</li>
				<ol id="9"></ol>
			</ol>
		</ol>
	</body>
</html>
